version: "2"

sql:
  - engine: "postgresql"
    queries: "./internal/adapters/postgresql/queries"
    schema: "./internal/adapters/postgresql/migrations"
    gen:
      go:
        package: "db"
        out: "./internal/adapters/postgresql/db"
        sql_package: "pgx/v5"
        emit_json_tags: true

        overrides:
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"